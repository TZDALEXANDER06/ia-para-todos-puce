name: Deploy GitHub Pages

# El sitio se publica en Vercel (con panel de administración dinámico). El
# export estático de GitHub Pages no es compatible con las rutas de API del
# admin, por eso este workflow ya no corre en cada push (solo manualmente).
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      STATIC_EXPORT: "true"
      GITHUB_PAGES: "true"
      NEXT_PUBLIC_STATIC_EXPORT: "true"
      NEXT_PUBLIC_SITE_URL: "https://tzdalexander06.github.io/ia-para-todos-puce"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build:pages

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
